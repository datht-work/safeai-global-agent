# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "SafeAI-Global Baseline Prompt Evaluation"

prompts:
  - file://../SKILL.md

providers:
  # Dùng OpenAI làm baseline để test logic prompt
  - id: openai:gpt-4o
    config:
      temperature: 0.1 # Đặt temperature thấp để đánh giá tính nhất quán pháp lý

tests:
  - description: "Kiểm tra Routing cho Healthcare US (HIPAA)"
    vars:
      user_input: "Write a PRD for a telehealth app capturing patient symptoms in California."
    assert:
      - type: "icontains"
        value: "skills/safeai-hipaa-expert/SKILL.md"
        weight: 2
      - type: "icontains"
        value: "HIPAA"
      - type: "icontains"
        value: "CCPA"
      - type: "not-icontains"
        value: "GDPR"

  - description: "Kiểm tra Routing cho FinTech EU (GDPR, PSD2)"
    vars:
      user_input: "Build a credit card payment feature for users in France."
    assert:
      - type: "icontains"
        value: "skills/safeai-fintech-compliance/SKILL.md"
      - type: "icontains"
        value: "skills/safeai-gdpr-expert/SKILL.md"
      - type: "icontains"
        value: "GDPR"
      - type: "icontains"
        value: "PSD2"

  - description: "Kiểm tra Template Generation cho FinTech VN"
    vars:
      user_input: "/template fintech vn"
    assert:
      - type: "icontains"
        value: "PDPL 2026"
      - type: "icontains"
        value: "SBV"
      - type: "icontains"
        value: "Decree 356"

  - description: "Kiểm tra Agile Engine (Jira Export)"
    vars:
      user_input: "/safeai export jira"
    assert:
      - type: "icontains"
        value: "Epic"
      - type: "icontains"
        value: "User Story"
      - type: "icontains"
        value: "Gherkin"

  - description: "Kiểm tra DevSecOps (Terraform Export)"
    vars:
      user_input: "/safeai export terraform"
    assert:
      - type: "icontains"
        value: "resource"
      - type: "icontains"
        value: "terraform"
      - type: "icontains"
        value: "hcl"

  - description: "Kiểm tra Multi-region Routing (Vietnam + AI Ethics)"
    vars:
      user_input: "Write a PRD for an AI credit scoring app in Vietnam focusing on bias prevention."
    assert:
      - type: "icontains"
        value: "safeai-ai-ethics-expert"
      - type: "icontains"
        value: "Decree"
      - type: "icontains"
        value: "RMF"

  - description: "Kiểm tra Routing cho FinTech VN (SBV Biometric)"
    vars:
      user_input: "Write a PRD for a mobile banking app in Vietnam with online payments."
    assert:
      - type: "icontains"
        value: "safeai-vietnam-compliance"
      - type: "icontains"
        value: "2345"
      - type: "icontains"
        value: "biometric"

  - description: "Kiểm tra Routing cho AI Product VN"
    vars:
      user_input: "Build a PRD for an AI-powered credit scoring system deployed in Ho Chi Minh City."
    assert:
      - type: "icontains"
        value: "safeai-vietnam-compliance"
      - type: "icontains"
        value: "Law on AI"
      - type: "icontains"
        value: "high-risk"

  - description: "Kiểm tra Template E-Commerce VN"
    vars:
      user_input: "/template ecommerce vn"
    assert:
      - type: "icontains"
        value: "Law on E-Commerce"
      - type: "icontains"
        value: "VNeID"
      - type: "icontains"
        value: "gatekeeper"

  - description: "Kiểm tra Routing cho US State Privacy (CCPA)"
    vars:
      user_input: "Write a PRD for a customer loyalty program in California and Virginia."
    assert:
      - type: "icontains"
        value: "safeai-us-privacy-expert"
      - type: "icontains"
        value: "CCPA"
      - type: "icontains"
        value: "VCDPA"

  - description: "Kiểm tra Routing cho EdTech (COPPA)"
    vars:
      user_input: "Design a PRD for an online learning app for kids under 13 in the US."
    assert:
      - type: "icontains"
        value: "safeai-edtech-compliance"
      - type: "icontains"
        value: "COPPA"

  - description: "Kiểm tra Routing cho ASEAN Markets (SG, TH, MY)"
    vars:
      user_input: "Create a PRD for a ride-hailing app launching in Singapore, Thailand, and Malaysia."
    assert:
      - type: "icontains"
        value: "safeai-asean-data-protection"
      - type: "icontains"
        value: "PDPA"

  - description: "Kiểm tra Code Scanner Routing"
    vars:
      user_input: "/safeai scan the following python code for vulnerabilities"
    assert:
      - type: "icontains"
        value: "safeai-code-scanner"

  - description: "Kiểm tra Standard PRD Mode (Skip Compliance)"
    vars:
      user_input: "Write a Standard PRD for an internal time-tracking tool."
    assert:
      - type: "not-icontains"
        value: "GDPR"
      - type: "not-icontains"
        value: "compliance"

  - description: "Kiểm tra Lệnh /safeai compare"
    vars:
      user_input: "/safeai compare Vietnam EU US"
    assert:
      - type: "icontains"
        value: "Vietnam"
      - type: "icontains"
        value: "EU"
      - type: "icontains"
        value: "US"
      - type: "icontains"
        value: "|"

  - description: "Kiểm tra Lệnh /safeai timeline"
    vars:
      user_input: "/safeai timeline for the current PRD"
    assert:
      - type: "icontains"
        value: "gantt"
      - type: "icontains"
        value: "dateFormat"

  - description: "Kiểm tra Lệnh /safeai start (Wizard)"
    vars:
      user_input: "/safeai start"
    assert:
      - type: "icontains"
        value: "Step 1"
      - type: "icontains"
        value: "Product Type"

  - description: "Kiểm tra Custom Policy Injection (Priority Override)"
    vars:
      user_input: "/safeai inject SecurityRule: No encryption needed for test env."
    assert:
      - type: "icontains"
        value: "No encryption needed"
      - type: "icontains"
        value: "CUSTOM OVERRIDE"

  - description: "Kiểm tra Multilingual Translation"
    vars:
      user_input: "/safeai lang japanese"
    assert:
      - type: "not-icontains"
        value: "PRD Structure"
      - type: "icontains"
        value: "Explicit Consent"
